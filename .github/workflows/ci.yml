name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  godot-checks:
    name: Godot import, parse check & smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v16

      - name: Run Godot checks
        run: nix develop --command ./.github/ci-check.sh
