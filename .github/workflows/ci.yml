name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  godot-checks:
    name: Godot import, parse check & smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Required so GitHub Actions exposes the OIDC token endpoints that
      # DeterminateSystems/nix-installer-action uses for FlakeHub.
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@v22

      - name: Run Godot checks
        run: nix develop --command ./.github/ci-check.sh
